<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dziennik Zadań</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" />
  <!-- jQuery UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.min.css" />
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" />
  <!-- Style -->
  <link rel="stylesheet" href="style.css">

</head>
<body>

<!-- ============================================== PASEK NAWIGACJI ============================================== -->
<nav class="pasek-nawigacji d-flex align-items-center justify-content-between">
  <span class="logo-tekst">Dziennik <span>Zadań</span></span>
  <div class="d-flex align-items-center gap-2">
    <button id="przyciskDodajZadanie" class="btn btn-sm btn-primary px-3">+ Dodaj zadanie</button>
    <button id="przyciskMotywu">🌙 Ciemny</button>
  </div>
</nav>

<!-- ============================================== STATYSTYKI ============================================== -->
<div class="pasek-statystyk" id="pasekStatystyk">
  <div class="karta-statystyki">Wszystkich: <strong id="statWszystkich">0</strong></div>
  <div class="karta-statystyki" style="color:var(--col-todo)">Do zrobienia: <strong id="statDoZrobienia">0</strong></div>
  <div class="karta-statystyki" style="color:var(--col-prog)">W toku: <strong id="statWToku">0</strong></div>
  <div class="karta-statystyki" style="color:var(--col-done)">Gotowe: <strong id="statGotowe">0</strong></div>
</div>

<!-- ============================================== WYSZUKIWARKA ============================================== -->
<div class="pasek-wyszukiwarki mt-3">
  <input type="text" id="wyszukiwarka" placeholder="🔍 Szukaj zadania na tablicy..." />
</div>

<!-- ============================================== TABLICA KANBAN ============================================== -->
<div class="tablica-wrapper" id="tablicaKanban">

  <!-- Do zrobienia -->
  <div class="kolumna-kanban" id="kolumna-todo">
    <div class="naglowek-kolumny">
      <span class="tytul-kolumny">
        <span class="kropka-kolumny" style="background:var(--col-todo)"></span>
        Do zrobienia
      </span>
      <span class="licznik-kolumny" id="licznik-todo">0</span>
    </div>
    <div class="lista-zadan" id="lista-todo"></div>
    <button class="przycisk-dodaj-karte" data-kolumna="todo">+ Dodaj kartę</button>
  </div>

  <!-- W toku -->
  <div class="kolumna-kanban" id="kolumna-inprogress">
    <div class="naglowek-kolumny">
      <span class="tytul-kolumny">
        <span class="kropka-kolumny" style="background:var(--col-prog)"></span>
        W toku
      </span>
      <span class="licznik-kolumny" id="licznik-inprogress">0</span>
    </div>
    <div class="lista-zadan" id="lista-inprogress"></div>
    <button class="przycisk-dodaj-karte" data-kolumna="inprogress">+ Dodaj kartę</button>
  </div>

  <!-- Gotowe -->
  <div class="kolumna-kanban" id="kolumna-done">
    <div class="naglowek-kolumny">
      <span class="tytul-kolumny">
        <span class="kropka-kolumny" style="background:var(--col-done)"></span>
        Gotowe
      </span>
      <span class="licznik-kolumny" id="licznik-done">0</span>
    </div>
    <div class="lista-zadan" id="lista-done"></div>
    <button class="przycisk-dodaj-karte" data-kolumna="done">+ Dodaj kartę</button>
  </div>

</div>

<!-- ============================================== TABELA ZADAŃ ============================================== -->
<div class="sekcja-tabeli">
  <p class="tytul-sekcji">📋 Wszystkie zadania</p>
  <div class="karta-tabeli">
    <table id="tabelaZadan" class="table table-hover w-100">
      <thead>
        <tr>
          <th>#</th>
          <th>Tytuł</th>
          <th>Opis</th>
          <th>Priorytet</th>
          <th>Kolumna</th>
          <th>Data</th>
          <th>Akcje</th>
        </tr>
      </thead>
      <tbody id="cialoTabeli"></tbody>
    </table>
  </div>
</div>

<!-- ============================================== MODAL: DODAJ / EDYTUJ ZADANIE ============================================== -->
<div class="modal fade" id="modalZadania" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="tytulModalu">Dodaj zadanie</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formularzZadania" novalidate>
          <input type="hidden" id="idEdycji" value="" />

          <div class="mb-3">
            <label for="poleTytulu" class="form-label">Tytuł *</label>
            <input type="text" id="poleTytulu" name="poleTytulu" class="form-control" placeholder="Nazwa zadania..." />
          </div>

          <div class="mb-3">
            <label for="poleOpisu" class="form-label">Opis</label>
            <textarea id="poleOpisu" name="poleOpisu" class="form-control" rows="3" placeholder="Opcjonalny opis..."></textarea>
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label for="polePriorytetu" class="form-label">Priorytet *</label>
              <select id="polePriorytetu" name="polePriorytetu" class="form-select">
                <option value="">-- wybierz --</option>
                <option value="niski">Niski</option>
                <option value="sredni">Średni</option>
                <option value="wysoki">Wysoki</option>
              </select>
            </div>
            <div class="col-6">
              <label for="poleKolumny" class="form-label">Kolumna *</label>
              <select id="poleKolumny" name="poleKolumny" class="form-select">
                <option value="">-- wybierz --</option>
                <option value="todo">Do zrobienia</option>
                <option value="inprogress">W toku</option>
                <option value="done">Gotowe</option>
              </select>
            </div>
          </div>

          <div class="mt-3">
            <label for="poleTerminu" class="form-label">Termin</label>
            <input type="text" id="poleTerminu" name="poleTerminu" class="form-control" placeholder="DD.MM.RRRR" autocomplete="off" />
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Anuluj</button>
        <button type="button" id="przyciskZapiszZadanie" class="btn btn-primary btn-sm px-4">Zapisz</button>
      </div>
    </div>
  </div>
</div>

<!-- Biblioteki -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<!-- Główny skrypt — musi być ostatni -->
<script src="script.js"></script>
</body>
</html>
